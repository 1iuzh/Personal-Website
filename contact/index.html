<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>与我联系 · Liuzhangbin.com</title>
  <meta
    name="description"
    content="如果你有任何想法、建议或纠错信息，欢迎通过邮箱与我联系。"
  />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #17233b;
      --text-secondary: #667085;
      --border: #e8edf3;
      --accent: #2675ed;
      --accent-light: #eef5ff;
      --shadow: 0 12px 40px rgba(31, 52, 81, 0.06);

      --content-width: 1080px;
      --header-height: 72px;

      --z-header: 100;
      --z-nav-mobile: 90;

      /* 无衬线字体栈：系统字体优先，中文兜底到常见系统黑体 */
      --font-sans:
        system-ui,
        -apple-system, BlinkMacSystemFont,
        "Microsoft YaHei",
        "PingFang SC",
        "Source Han Sans SC", "Noto Sans SC",
        "HarmonyOS Sans",
        "Hiragino Sans GB",
        "WenQuanYi Micro Hei",
        sans-serif;

      /* 等宽字体栈：用于版本号、校验值等代码感文字 */
      --font-mono:
        ui-monospace,
        "SF Mono",
        "Cascadia Code", "Consolas",
        "JetBrains Mono",
        "Roboto Mono",
        "Sarasa Mono SC",
        "Microsoft YaHei", "PingFang SC", "Noto Sans SC",
        "WenQuanYi Zen Hei Mono",
        monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ========== Header ========== */

    header {
      height: var(--header-height);
      position: sticky;
      top: 0;
      z-index: var(--z-header);

      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid transparent;

      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);

      transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    /* 滚动超过阈值后，header 出现底部分隔线和轻微阴影 */
    header.scrolled {
      border-bottom-color: rgba(232, 237, 243, 0.95);
      box-shadow: 0 4px 24px rgba(31, 52, 81, 0.04);
    }

    .header-inner {
      width: min(var(--content-width), calc(100% - 48px));
      height: 100%;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    /* ========== Brand ========== */

    .brand {
      display: inline-flex;
      align-items: center;
      color: var(--text);
      flex-shrink: 0;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .brand:hover {
      opacity: 0.78;
      transform: translateY(-1px);
    }

    .brand:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 8px;
    }

    .brand-name {
      font-family: var(--font-sans);
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    /* ========== Navigation（桌面端横向导航）========== */

    .nav {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav a {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;

      height: 40px;
      padding: 0 18px;

      color: var(--text-secondary);
      border-radius: 10px;

      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.15px;

      transition:
        color 0.22s ease,
        background 0.22s ease,
        transform 0.22s ease;
    }

    /* 悬停/聚焦时从下方弹出的小圆点下划线 */
    .nav a::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 18px;
      height: 2.5px;
      background: var(--accent);
      border-radius: 99px;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: var(--text);
      background: rgba(245, 247, 250, 0.9);
    }

    .nav a:hover::after,
    .nav a:focus-visible::after {
      transform: translateX(-50%) scaleX(1);
      opacity: 1;
    }

    .nav a.active {
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-light);
    }

    .nav a.active::after {
      transform: translateX(-50%) scaleX(1);
      opacity: 1;
      width: 14px;
    }

    .nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ========== Mobile Menu Toggle（汉堡按钮）========== */

    .menu-toggle {
      display: none;
      width: 40px;
      height: 40px;

      align-items: center;
      justify-content: center;

      background: none;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text);

      transition: background 0.2s ease;
    }

    .menu-toggle:hover {
      background: #f5f7fa;
    }

    .menu-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* 汉堡图标的三条线：展开时通过 transform 位移 + 旋转组成「×」，
       确保旋转中心始终对齐 */
    .menu-toggle .icon-line {
      position: absolute;
      left: 0;
      width: 20px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition:
        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.2s ease;
    }

    .menu-toggle .icon-line-wrap {
      position: relative;
      width: 20px;
      height: 20px;
    }

    .icon-line--top {
      top: 4px;
    }

    .icon-line--middle {
      top: 9px;
    }

    .icon-line--bottom {
      top: 14px;
    }

    .menu-toggle[aria-expanded="true"] .icon-line--top {
      transform: translateY(5px) rotate(45deg);
    }

    .menu-toggle[aria-expanded="true"] .icon-line--middle {
      opacity: 0;
    }

    .menu-toggle[aria-expanded="true"] .icon-line--bottom {
      transform: translateY(-5px) rotate(-45deg);
    }

    /* ========== Main ========== */

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 74px 24px 82px;
    }

    .contact-card {
      width: min(var(--content-width), 100%);
      min-height: 610px;
      margin: 0 auto;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 72px 40px;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    /* ========== Envelope Icon ========== */

    .icon-wrapper {
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;

      background: radial-gradient(
        circle at center,
        #edf5ff 0%,
        #edf5ff 58%,
        transparent 59%
      );
    }

    .mail-icon {
      width: 58px;
      height: 58px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ========== Title ========== */

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1.25;
      font-weight: 700;
    }

    .title-line {
      width: 46px;
      height: 4px;
      margin: 20px auto 30px;
      background: var(--accent);
      border-radius: 99px;
    }

    .description {
      color: #344054;
      font-size: 20px;
      line-height: 1.8;
      letter-spacing: 0.2px;
      text-align: center;
    }

    /* ========== Email ========== */

    .email-link {
      width: min(660px, 100%);
      margin-top: 38px;
      padding: 24px 32px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;

      background: var(--accent-light);
      border: 1px solid #e2edff;
      border-radius: 14px;
      color: var(--accent);

      font-family: var(--font-mono);
      font-size: clamp(22px, 2.8vw, 28px);
      font-weight: 600;
      letter-spacing: 0.2px;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .email-link:hover,
    .email-link:focus-visible {
      background: #e8f1ff;
      border-color: #d4e4ff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(38, 117, 237, 0.08);
    }

    .email-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .email-icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ========== Note ========== */

    .note {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.6;
    }

    .note-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ========== Responsive ========== */

    @media (max-width: 768px) {
      :root {
        --header-height: 64px;
      }

      .header-inner {
        width: calc(100% - 32px);
      }

      /* 导航变成 header 下方的整行下拉面板，
         通过 max-height 过渡实现展开/收起动画 */
      .nav {
        position: fixed;
        top: var(--header-height);
        left: 0;
        right: 0;
        z-index: var(--z-nav-mobile);

        height: auto;
        max-height: 0;
        overflow: hidden;

        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 0 16px;

        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);

        border-bottom: 1px solid transparent;
        box-shadow: none;

        transition:
          max-height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          padding 0.35s ease,
          border-color 0.35s ease,
          box-shadow 0.35s ease;
      }

      .nav.open {
        max-height: 300px;
        padding: 12px 16px 18px;
        border-bottom-color: var(--border);
        box-shadow: 0 12px 32px rgba(31, 52, 81, 0.06);
      }

      .nav a {
        height: 48px;
        justify-content: flex-start;
        padding: 0 16px;
        font-size: 15.5px;
        border-radius: 11px;
      }

      .nav a::after {
        display: none;
      }

      .nav a.active {
        background: var(--accent-light);
      }

      .menu-toggle {
        display: flex;
      }

      main {
        padding: 32px 16px 48px;
      }

      .contact-card {
        min-height: 520px;
        padding: 56px 24px;
        border-radius: 14px;
      }

      .description {
        font-size: 17px;
      }

      .email-link {
        padding: 20px 18px;
        font-size: 21px;
        gap: 10px;
      }

      .email-icon {
        width: 27px;
        height: 27px;
      }

      .note {
        font-size: 14px;
        text-align: center;
      }
    }

    @media (max-width: 520px) {
      .header-inner {
        width: calc(100% - 24px);
      }

      .contact-card {
        padding: 48px 20px;
      }

      .description {
        max-width: 290px;
      }

      .email-link {
        font-size: 19px;
      }

      .note {
        max-width: 280px;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <!-- 页眉：品牌名 + 导航 -->
  <header id="site-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="返回首页">
        <span class="brand-name">Liuzhangbin.com</span>
      </a>

      <!-- 桌面端横向导航 / 移动端下拉面板，同一份 DOM 靠媒体查询切换样式 -->
      <nav class="nav" id="main-nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/123/">网址导航</a>
        <a href="/creative/">创意工坊</a>
        <a href="/contact/" class="active">与我联系</a>
      </nav>

      <!-- 移动端汉堡菜单按钮，展开时图标变成「×」 -->
      <button
        class="menu-toggle"
        id="menu-toggle"
        aria-label="展开导航菜单"
        aria-expanded="false"
        aria-controls="main-nav"
      >
        <span class="icon-line-wrap" aria-hidden="true">
          <span class="icon-line icon-line--top"></span>
          <span class="icon-line icon-line--middle"></span>
          <span class="icon-line icon-line--bottom"></span>
        </span>
      </button>
    </div>
  </header>

  <!-- 主体：联系卡片 -->
  <main>
    <section class="contact-card">
      <div class="icon-wrapper">
        <svg class="mail-icon" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="9" y="15" width="46" height="34" rx="5"></rect>
          <path d="M11 19l21 17 21-17"></path>
        </svg>
      </div>

      <div class="title">
        <h1>与我联系</h1>
        <div class="title-line"></div>
      </div>

      <p class="description">
        任何想法、建议或纠错信息，都欢迎通过邮箱与我联系。
      </p>

      <!-- 邮箱地址由脚本动态拼接写入，避免被爬虫直接抓取明文地址 -->
      <a class="email-link" id="contact-email" aria-label="发送邮件联系我">
        <svg class="email-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M4 7l8 6 8-6"></path>
        </svg>
        <span id="contact-email-text">加载中…</span>
      </a>

      <p class="note">
        <svg class="note-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3l7 3v5c0 4.5-2.9 7.9-7 10-4.1-2.1-7-5.5-7-10V6l7-3z"
          ></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
        <span>我会尽快查看并回复你的邮件，感谢你的关注与支持。</span>
      </p>
    </section>
  </main>

  <script>
    // 拆分 user/domain 两段拼接成邮箱地址，降低被自动化脚本扫描到明文邮箱的概率
    (function () {
      var user = "liu.zhangbin";
      var domain = "qq.com";
      var address = user + "@" + domain;

      var link = document.getElementById("contact-email");
      var text = document.getElementById("contact-email-text");

      if (link && text) {
        link.href = "mailto:" + address;
        link.setAttribute("aria-label", "发送邮件至 " + address);
        text.textContent = address;
      }
    })();
  </script>

  <script>
    // 移动端导航菜单交互 + 页面滚动时的页眉样式切换
    (function () {
      var toggle = document.getElementById("menu-toggle");
      var nav = document.getElementById("main-nav");
      var header = document.getElementById("site-header");

      if (toggle && nav) {
        function openMenu() {
          nav.classList.add("open");
          toggle.setAttribute("aria-expanded", "true");
          toggle.setAttribute("aria-label", "收起导航菜单");
        }

        function closeMenu() {
          nav.classList.remove("open");
          toggle.setAttribute("aria-expanded", "false");
          toggle.setAttribute("aria-label", "展开导航菜单");
        }

        toggle.addEventListener("click", function (event) {
          // 阻止冒泡，避免立刻被下面的「点击外部关闭」逻辑关掉
          event.stopPropagation();
          nav.classList.contains("open") ? closeMenu() : openMenu();
        });

        // 点击导航中的任意链接后自动收起菜单
        nav.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", closeMenu);
        });

        // 点击菜单和按钮以外的区域时关闭菜单
        document.addEventListener("click", function (event) {
          var clickedInside = nav.contains(event.target) || toggle.contains(event.target);
          if (!clickedInside) closeMenu();
        });

        // 按下 Esc 键时关闭菜单
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") closeMenu();
        });
      }

      // 页面滚动超过阈值后，给 header 加上分隔线和阴影
      if (header) {
        var SCROLL_THRESHOLD = 8;

        var onScroll = function () {
          header.classList.toggle("scrolled", window.scrollY > SCROLL_THRESHOLD);
        };

        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }
    })();
  </script>
</body>
</html>
