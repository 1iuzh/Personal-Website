<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>与我联系 · Liuzhangbin.com</title>
    <meta
      name="description"
      content="如果你有任何想法、建议或纠错信息，欢迎通过邮箱与我联系。"
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #17233b;
        --text-secondary: #667085;
        --border: #e8edf3;
        --accent: #2675ed;
        --accent-light: #eef5ff;
        --shadow: 0 12px 40px rgba(31, 52, 81, 0.06);

        --content-width: 1080px;
        --header-height: 82px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;

        background: var(--bg);
        color: var(--text);

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* =========================
       Header
    ========================= */

      header {
        height: var(--header-height);

        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--border);

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-inner {
        width: min(var(--content-width), calc(100% - 48px));
        height: 100%;
        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 42px;
      }

      .nav a {
        height: 100%;

        display: flex;
        align-items: center;

        position: relative;

        color: #344054;
        font-size: 16px;
        font-weight: 500;

        transition:
          color 0.2s ease,
          transform 0.2s ease;
      }

      .nav a:hover,
      .nav a:focus-visible {
        color: var(--accent);
      }

      .nav a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: 4px;
      }

      .nav a.active {
        color: var(--text);
      }

      .nav a.active::after {
        content: "";

        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;

        height: 3px;

        background: var(--accent);
        border-radius: 3px 3px 0 0;
      }

      /* =========================
       Main
    ========================= */

      main {
        flex: 1;

        display: flex;
        align-items: center;

        padding: 74px 24px 82px;
      }

      .contact-card {
        width: min(var(--content-width), 100%);
        min-height: 610px;

        margin: 0 auto;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 72px 40px;

        background: var(--surface);
        border-radius: 18px;

        box-shadow: var(--shadow);
      }

      /* =========================
       Envelope Icon
    ========================= */

      .icon-wrapper {
        width: 108px;
        height: 108px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 24px;

        background: radial-gradient(
          circle at center,
          #edf5ff 0%,
          #edf5ff 58%,
          transparent 59%
        );
      }

      .mail-icon {
        width: 58px;
        height: 58px;

        fill: none;
        stroke: var(--accent);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* =========================
       Title
    ========================= */

      .title {
        text-align: center;
      }

      .title h1 {
        font-size: clamp(34px, 4vw, 48px);
        line-height: 1.25;
        font-weight: 700;
      }

      .title-line {
        width: 46px;
        height: 4px;

        margin: 20px auto 30px;

        background: var(--accent);
        border-radius: 99px;
      }

      .description {
        color: #344054;

        font-size: 20px;
        line-height: 1.8;
        letter-spacing: 0.2px;

        text-align: center;
      }

      /* =========================
       Email
    ========================= */

      .email-link {
        width: min(660px, 100%);

        margin-top: 38px;
        padding: 24px 32px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;

        background: var(--accent-light);
        border: 1px solid #e2edff;
        border-radius: 14px;

        color: var(--accent);

        font-family:
          "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono",
          monospace;
        font-size: clamp(22px, 2.8vw, 28px);
        font-weight: 600;
        letter-spacing: 0.2px;

        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .email-link:hover,
      .email-link:focus-visible {
        background: #e8f1ff;
        border-color: #d4e4ff;

        transform: translateY(-2px);

        box-shadow: 0 8px 24px rgba(38, 117, 237, 0.08);
      }

      .email-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .email-icon {
        width: 34px;
        height: 34px;

        flex-shrink: 0;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* =========================
       Note
    ========================= */

      .note {
        margin-top: 34px;

        display: flex;
        align-items: center;
        gap: 10px;

        color: var(--text-secondary);

        font-size: 16px;
        line-height: 1.6;
      }

      .note-icon {
        width: 22px;
        height: 22px;

        flex-shrink: 0;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* =========================
       Responsive
    ========================= */

      @media (max-width: 768px) {
        :root {
          --header-height: 70px;
        }

        .header-inner {
          width: calc(100% - 32px);
        }

        .nav {
          gap: 20px;
        }

        .nav a {
          font-size: 14px;
        }

        main {
          padding: 32px 16px 48px;
        }

        .contact-card {
          min-height: 520px;
          padding: 56px 24px;
          border-radius: 14px;
        }

        .description {
          font-size: 17px;
        }

        .email-link {
          padding: 20px 18px;
          font-size: 21px;
          gap: 10px;
        }

        .email-icon {
          width: 27px;
          height: 27px;
        }

        .note {
          font-size: 14px;
          text-align: center;
        }
      }

      @media (max-width: 520px) {
        .nav {
          gap: 14px;
        }

        .nav a {
          font-size: 13px;
        }

        .nav a:nth-child(2) {
          display: none;
        }

        .contact-card {
          padding: 48px 20px;
        }

        .description {
          max-width: 290px;
        }

        .email-link {
          font-size: 19px;
        }

        .note {
          max-width: 280px;
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
       Header
  ========================== -->
    <header>
      <div class="header-inner">
        <nav class="nav">
          <a href="/">首页</a>
          <a href="/123/">网址导航</a>
          <a href="/creative/">创意工坊</a>
          <a href="/contact/" class="active">与我联系</a>
        </nav>
      </div>
    </header>

    <!-- =========================
       Main
  ========================== -->
    <main>
      <section class="contact-card">
        <div class="icon-wrapper">
          <svg class="mail-icon" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="9" y="15" width="46" height="34" rx="5"></rect>
            <path d="M11 19l21 17 21-17"></path>
          </svg>
        </div>

        <div class="title">
          <h1>与我联系</h1>
          <div class="title-line"></div>
        </div>

        <p class="description">
          任何想法、建议或纠错信息，都欢迎通过邮箱与我联系。
        </p>

        <a class="email-link" id="contact-email" aria-label="发送邮件联系我">
          <svg class="email-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M4 7l8 6 8-6"></path>
          </svg>

          <span id="contact-email-text">加载中…</span>
        </a>

        <p class="note">
          <svg class="note-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3l7 3v5c0 4.5-2.9 7.9-7 10-4.1-2.1-7-5.5-7-10V6l7-3z"
            ></path>
            <path d="M9 12l2 2 4-4"></path>
          </svg>

          <span>我会尽快查看并回复你的邮件，感谢你的关注与支持。</span>
        </p>
      </section>
    </main>

    <script>
      (function () {
        var user = "liu.zhangbin";
        var domain = "qq.com";
        var address = user + "@" + domain;

        var link = document.getElementById("contact-email");
        var text = document.getElementById("contact-email-text");

        if (link && text) {
          link.href = "mailto:" + address;
          link.setAttribute("aria-label", "发送邮件至 " + address);
          text.textContent = address;
        }
      })();
    </script>
  </body>
</html>
