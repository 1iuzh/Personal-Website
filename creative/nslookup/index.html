<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>高级 DNS 解析工具</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="nslookup.css">
    </head>

    <body data-theme="dark">

        <nav class="site-nav" aria-label="主导航">
            <div class="nav-inner">
                <div class="nav-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="nav-links">
                    <a href="/">首页</a>
                    <a href="/123/">网址导航</a>
                    <a href="/creative/">创意工坊</a>
                </div>
            </div>
        </nav>

        <div class="container">

            <header>
                <h1>DNS 解析工具</h1>
                <p>快速、精准地查询域名或 IP 地址的 DNS 记录</p>
                <button id="theme-toggle-btn" title="切换主题">
                </button>
            </header>

            <main>
                <div class="input-group">
                    <div class="input-field">
                        <label for="queryInput">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor">
                                <path stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
                            </svg>
                            域名或 IP 地址
                        </label>
                        <input type="text" id="queryInput"
                            placeholder="例如: google.com 或 8.8.8.8"
                            autocomplete="off"
                            spellcheck="false">
                        <div id="inputHint" class="input-hint"></div>
                    </div>
                    <div class="input-field">
                        <label for="type">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor">
                                <path stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.004.827c-.292.24-.437.613-.43.992a6.759 6.759 0 0 1 0 1.845c.007.379.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.6 6.6 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.397-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.759 6.759 0 0 1 0-1.845c-.007-.379-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281Z" />
                                <path stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                            记录类型
                        </label>
                        <select id="type">
                            <option value="A">A (IPv4)</option>
                            <option value="AAAA">AAAA (IPv6)</option>
                            <option value="MX">MX (邮件)</option>
                            <option value="TXT">TXT (文本)</option>
                            <option value="NS">NS (域名服务器)</option>
                            <option value="CNAME">CNAME (别名)</option>
                            <option value="SOA">SOA (起始授权)</option>
                            <option value="SRV">SRV (服务定位)</option>
                            <option value="CAA">CAA (证书颁发机构授权)</option>
                            <option value="PTR">PTR (反向解析)</option>
                            <option value="ANY">ANY (所有类型)</option>
                        </select>
                    </div>
                    <div class="input-field">
                        <label for="provider">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor">
                                <path stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3m-13.5 0h13.5m-13.5 0a3 3 0 0 0-3 3v.75a3 3 0 0 0 3 3h13.5a3 3 0 0 0 3-3v-.75a3 3 0 0 0-3-3m-13.5 0h13.5" />
                            </svg>
                            DNS 服务商
                        </label>
                        <select id="provider">
                            <option value="alidns">Aliyun DNS</option>
                            <option value="cloudflare">Cloudflare DNS</option>
                            <option value="google">Google Public DNS</option>
                        </select>
                    </div>
                </div>

                <div class="all-actions">
                    <button id="query-btn" class="btn btn-primary"
                        onclick="lookup(false)">
                        <span class="loader" id="query-loader"
                            style="display: none;"></span>
                        <svg id="query-icon" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24"
                            stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                        </svg>
                        查询记录
                    </button>

                    <button id="refresh-btn" class="btn btn-secondary"
                        onclick="lookup(true)" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        强制刷新
                    </button>

                    <button id="stop-btn" class="btn btn-danger"
                        onclick="stopQuery()" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M6 18 18 6M6 6l12 12" />
                        </svg>
                        停止
                    </button>

                    <button id="clear-result-btn" class="btn btn-utility"
                        onclick="clearResults()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>
                        清除结果
                    </button>

                    <button id="clear-cache-btn" class="btn btn-utility"
                        onclick="clearCache()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 10.5v5.25m-4.5 0h9" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.122 2.122l7.81-7.81" />
                        </svg>
                        清除缓存
                    </button>

                </div>
                <div id="result">
                    <div class="message message-info fade-in"
                        id="initial-message" style="display: flex;"> <svg
                            xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                        </svg>
                        <div>输入域名或 IP 地址，选择类型和服务商后开始查询。</div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="site-footer">
            <div class="footer-inner">
                <div class="footer-grid">
                    <div class="footer-brand">
                        <div class="brand-name">DNS 解析工具</div>
                        <p>快速、精准查询域名或 IP 的 DNS 记录，支持多种记录类型与公共 DNS 服务商。</p>
                        <span class="version-tag">DoH · 多服务商 · 本地缓存</span>
                    </div>
                    <div class="footer-col">
                        <h3>导航</h3>
                        <ul>
                            <li><a href="/">首页</a></li>
                            <li><a href="/123/">网址导航</a></li>
                            <li><a href="/creative/">创意工坊</a></li>
                        </ul>
                    </div>
                    <div class="footer-col">
                        <h3>支持</h3>
                        <ul>
                            <li><a href="/contact/">联系作者</a></li>
                            <li><a href="">更新日志</a></li>
                            <li><a href="">隐私政策</a></li>
                        </ul>
                    </div>
                </div>
                <div class="footer-divider"></div>
                <div class="footer-bottom">
                    <span class="copyright">Copyright © 2025 LIUZHANGBIN.</span>
                    <span class="powered">Powered by KFC</span>
                </div>
            </div>
        </footer>

        <script src="nslookup.js" defer></script>
    </body>

</html>
