<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="快速、精准地查询域名或 IP 地址的 DNS 记录">
    <title>DNS 解析工具 - Liuzhangbin</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nslookup.css">
</head>

<body>

    <nav class="site-nav" aria-label="主导航">
        <div class="nav-inner">
            <a class="nav-brand" href="/creative/nslookup/">
                <span class="logo-mark" aria-hidden="true">NS</span>
                <span class="nav-brand-divider" aria-hidden="true"></span>
                <span class="nav-brand-text">NSlookup</span>
            </a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/123/">网址导航</a>
                <a href="/creative/">创意工坊</a>
            </div>
        </div>
    </nav>

    <main id="main" class="page">

        <div class="hero">
            <div class="eyebrow">TOOL · DNS LOOKUP</div>
            <h1>DNS 解析工具</h1>
            <p class="subtitle">快速、精准地查询域名或 IP 地址的 DNS 记录</p>
        </div>

        <!-- 查询设置 -->
        <div class="card">
            <h2>查询设置 <span class="tag">// query</span></h2>

            <div class="input-group">
                <div class="input-field">
                    <label for="queryInput">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="8.5"/>
                            <path d="M3.5 12h17"/>
                            <path d="M12 3.5c-2.6 2.4-2.6 14.6 0 17M12 3.5c2.6 2.4 2.6 14.6 0 17"/>
                        </svg>
                        域名或 IP 地址
                    </label>
                    <input type="text" id="queryInput" placeholder="例如: google.com 或 8.8.8.8" autocomplete="off" spellcheck="false">
                    <div id="inputHint" class="input-hint"></div>
                </div>
                <div class="input-field">
                    <label for="type">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12.5 3.5h5A2 2 0 0 1 19.5 5.5v5a2 2 0 0 1-.586 1.414l-7.5 7.5a2 2 0 0 1-2.828 0l-5-5a2 2 0 0 1 0-2.828l7.5-7.5A2 2 0 0 1 12.5 3.5Z"/>
                            <circle cx="15.5" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>
                        </svg>
                        记录类型
                    </label>
                    <select id="type">
                        <option value="A">A (IPv4)</option>
                        <option value="AAAA">AAAA (IPv6)</option>
                        <option value="MX">MX (邮件)</option>
                        <option value="TXT">TXT (文本)</option>
                        <option value="NS">NS (域名服务器)</option>
                        <option value="CNAME">CNAME (别名)</option>
                        <option value="SOA">SOA (起始授权)</option>
                        <option value="SRV">SRV (服务定位)</option>
                        <option value="CAA">CAA (证书颁发机构授权)</option>
                        <option value="PTR">PTR (反向解析)</option>
                        <option value="ANY">ANY (所有类型)</option>
                    </select>
                </div>
                <div class="input-field">
                    <label for="provider">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3.5" y="4" width="17" height="6" rx="1.5"/>
                            <rect x="3.5" y="14" width="17" height="6" rx="1.5"/>
                            <path d="M7 7h.01M7 17h.01"/>
                        </svg>
                        DNS 服务商
                    </label>
                    <select id="provider">
                        <option value="alidns">Aliyun DNS</option>
                        <option value="cloudflare">Cloudflare DNS</option>
                        <option value="google">Google Public DNS</option>
                    </select>
                </div>
            </div>

            <div class="all-actions">
                <button id="query-btn" class="btn btn-primary" onclick="lookup(false)">
                    <span class="loader" id="query-loader" style="display: none;"></span>
                    <svg class="icon" id="query-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="10.5" cy="10.5" r="6.5"/>
                        <path d="m20 20-4.3-4.3"/>
                    </svg>
                    查询记录
                </button>

                <button id="refresh-btn" class="btn btn-secondary" onclick="lookup(true)" disabled>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4v5h5"/>
                        <path d="M20 20v-5h-5"/>
                        <path d="M5.5 9a7 7 0 0 1 12-3.5L20 8"/>
                        <path d="M18.5 15a7 7 0 0 1-12 3.5L4 16"/>
                    </svg>
                    强制刷新
                </button>

                <button id="stop-btn" class="btn btn-danger" onclick="stopQuery()" disabled>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 6l12 12M18 6 6 18"/>
                    </svg>
                    停止
                </button>

                <button id="clear-result-btn" class="btn btn-utility" onclick="clearResults()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 7h14"/>
                        <path d="M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/>
                        <path d="M7 7l.8 12a2 2 0 0 0 2 1.9h4.4a2 2 0 0 0 2-1.9L17 7"/>
                        <path d="M10 11v6M14 11v6"/>
                    </svg>
                    清除结果
                </button>

                <button id="clear-cache-btn" class="btn btn-utility" onclick="clearCache()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="10.5" cy="6" rx="6.5" ry="2.3"/>
                        <path d="M4 6v6c0 1.27 2.91 2.3 6.5 2.3"/>
                        <path d="m16.5 15.5 4 4m0-4-4 4"/>
                    </svg>
                    清除缓存
                </button>
            </div>
        </div>

        <!-- 查询结果 -->
        <div class="card">
            <h2>查询结果 <span class="tag">// result</span></h2>
            <div id="result">
                <div class="message message-info fade-in" id="initial-message" style="display: flex;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="8.5"/>
                        <path d="M12 11v5"/>
                        <circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/>
                    </svg>
                    <div>输入域名或 IP 地址，选择类型和服务商后开始查询。</div>
                </div>
            </div>
        </div>

    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-grid">
                <div class="footer-brand">
                    <div class="brand-name">DNS 解析工具</div>
                    <p>快速、精准查询域名或 IP 的 DNS 记录，支持多种记录类型与公共 DNS 服务商。</p>
                    <span class="version-tag">DoH · 多服务商 · 本地缓存</span>
                </div>
                <div class="footer-col-support">
                    <div class="footer-pill-row">
                        <a class="footer-pill" href="/contact/">
                            <span class="footer-pill-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
                            </span>
                            <span>与我联系</span>
                        </a>
                        <a class="footer-pill" href="">
                            <span class="footer-pill-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h10a2 2 0 0 1 2 2v13l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z"/><path d="M9 9h6M9 13h6"/></svg>
                            </span>
                            <span>更新日志</span>
                        </a>
                        <a class="footer-pill" href="https://github.com/" target="_blank" rel="noopener">
                            <span class="footer-pill-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.73-1.56-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.07.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.2.66.79.55A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
                            </span>
                            <span>GitHub</span>
                        </a>
                        <a class="footer-pill" href="">
                            <span class="footer-pill-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6v6c0 4.5 3 7.2 7 8.5 4-1.3 7-4 7-8.5V6l-7-2.5Z"/><path d="m9.3 12 1.9 1.9 3.4-3.6"/></svg>
                            </span>
                            <span>隐私政策</span>
                        </a>
                    </div>
                </div>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-bottom">
                <span class="copyright">Copyright © 2025–2026 LIUZHANGBIN.</span>
                <span class="powered">Powered by KFC</span>
            </div>
        </div>
    </footer>

    <script src="nslookup.js" defer></script>
</body>

</html>
