<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="常用软件清单，精选常用办公、浏览器、系统维护、文件处理等软件。" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <title>常用软件清单 - Liuzhangbin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="newbuild.css" />
    </head>

    <body>
        <nav class="site-nav" aria-label="主导航">
            <div class="nav-inner">
                <a class="nav-brand" href="/creative/newbuild/">
                    <span class="logo-mark" aria-hidden="true">SW</span>
                    <span class="nav-brand-divider" aria-hidden="true"></span>
                    <span class="nav-brand-text">NewBuild</span>
                </a>
                <div class="nav-links">
                    <a href="/">首页</a>
                    <a href="/123/">网址导航</a>
                    <a href="/creative/">创意工坊</a>
                </div>
            </div>
        </nav>

        <main id="main" class="page">
            <div class="hero">
                <div class="eyebrow">SOFTWARE COLLECTION</div>
                <h1>常用软件清单</h1>
                <p class="hero-subtitle">精选常用软件，整理常见工具，让每一次安装都更简单。</p>

                <div class="search-wrapper">
                    <svg
                        class="search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-4-4" />
                    </svg>
                    <input
                        id="searchInput"
                        class="search-input"
                        type="search"
                        placeholder="搜索软件，例如：Chrome、Office、截图……"
                        autocomplete="off"
                    />
                </div>
            </div>

            <div class="toolbar">
                <div class="toolbar-title">软件分类</div>
                <div id="softwareCount" class="toolbar-count"></div>
            </div>

            <div id="softwareCategories" class="software-grid"></div>

            <div id="emptyState" class="empty-state">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-4-4" />
                </svg>
                <div class="empty-state-title">没有找到相关软件</div>
                <div class="empty-state-description">换一个关键词试试看</div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="footer-inner">
                <div class="footer-grid">
                    <div class="footer-brand">
                        <div class="brand-name">常用软件清单</div>
                        <p>精选常用办公、浏览器、系统维护、文件处理等软件，方便装机、重装系统时快速查找下载地址。</p>
                        <span class="version-tag">持续更新 · 直达下载</span>
                    </div>
                    <div class="footer-col-support">
                        <div class="footer-pill-row">
                            <a class="footer-pill" href="/contact/">
                                <span class="footer-pill-icon" aria-hidden="true">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <rect x="3.5" y="5.5" width="17" height="13" rx="2" />
                                        <path d="m4 7 8 6 8-6" />
                                    </svg>
                                </span>
                                <span>与我联系</span>
                            </a>
                            <a class="footer-pill" href="">
                                <span class="footer-pill-icon" aria-hidden="true">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <path d="M8 4h10a2 2 0 0 1 2 2v13l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z" />
                                        <path d="M9 9h6M9 13h6" />
                                    </svg>
                                </span>
                                <span>更新日志</span>
                            </a>
                            <a class="footer-pill" href="https://github.com/" target="_blank" rel="noopener">
                                <span class="footer-pill-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                        <path
                                            d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.4-1.27.73-1.56-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.07.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.2.66.79.55A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"
                                        />
                                    </svg>
                                </span>
                                <span>GitHub</span>
                            </a>
                            <a class="footer-pill" href="">
                                <span class="footer-pill-icon" aria-hidden="true">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <path d="M12 3.5 5 6v6c0 4.5 3 7.2 7 8.5 4-1.3 7-4 7-8.5V6l-7-2.5Z" />
                                        <path d="m9.3 12 1.9 1.9 3.4-3.6" />
                                    </svg>
                                </span>
                                <span>隐私政策</span>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="footer-divider"></div>
                <div class="footer-bottom">
                    <span class="copyright">Copyright © 2025–2026 LIUZHANGBIN.</span>
                </div>
            </div>
        </footer>

        <script src="newbuild.js"></script>
    </body>
</html>
