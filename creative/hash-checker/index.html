<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="如果你有任何想法、建议或纠错信息，欢迎通过邮箱与我联系。" />
  <meta name="theme-color" content="#f8fafc" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <title>与我联系 · Liuzhangbin.com</title>

  <style>
    :root {
      --bg: #f8fafc;
      --bg-deep: #eef2f6;

      --text: #17233b;
      --text-soft: #475467;
      --text-light: #8a94a6;

      --accent: #2675ed;
      --accent-dark: #1a5fd0;
      --accent-light: #eef5ff;

      --white: rgba(255, 255, 255, 0.7);

      --border: #e8edf3;

      --shadow: 0 20px 60px rgba(23, 35, 59, 0.08);
      --shadow-hover: 0 28px 70px rgba(23, 35, 59, 0.12);

      --radius-large: 22px;
      --radius-medium: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

      font-size: 16px;

      color: var(--text);

      background: var(--bg);

      line-height: 1.7;

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    /* ==================================================
           背景
        ================================================== */

    .background {
      position: fixed;

      inset: 0;

      z-index: -10;

      overflow: hidden;

      pointer-events: none;
    }

    .background::before {
      content: "";

      position: absolute;

      width: 600px;
      height: 600px;

      top: -250px;
      left: -180px;

      border-radius: 50%;

      background: radial-gradient(circle,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(255, 255, 255, 0) 70%);
    }

    .background::after {
      content: "";

      position: absolute;

      width: 700px;
      height: 700px;

      right: -300px;
      bottom: -300px;

      border-radius: 50%;

      background: radial-gradient(circle,
          rgba(38, 117, 237, 0.06) 0%,
          rgba(38, 117, 237, 0) 70%);
    }

    /* ==================================================
           页面
        ================================================== */

    .page {
      flex: 1;

      display: flex;
      flex-direction: column;

      width: min(1120px, calc(100% - 48px));

      margin: 0 auto;

      padding: 28px 0 35px;
    }

    /* ==================================================
           顶部导航
        ================================================== */

    .navbar {
      position: relative;

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 52px;
    }

    .brand {
      display: inline-flex;

      align-items: center;

      gap: 10px;

      color: var(--text);

      text-decoration: none;

      font-size: 17px;

      font-weight: 400;

      letter-spacing: 0.5px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--accent);

      box-shadow: 0 0 0 5px var(--accent-light);
    }

    .nav-links {
      display: flex;

      align-items: center;

      gap: 30px;
    }

    .nav-links a {
      position: relative;

      color: var(--text-soft);

      text-decoration: none;

      font-size: 15px;

      font-weight: 500;

      transition: color 0.2s ease;
    }

    .nav-links a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -7px;

      width: 0;
      height: 2px;

      background: var(--accent);

      border-radius: 2px;

      transition: width 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--accent);
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      width: 100%;
    }

    .nav-links a.active {
      color: var(--text);
    }

    .nav-links a.active::after {
      width: 100%;
    }

    .nav-links a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* ==================================================
           移动端菜单按钮（汉堡）
        ================================================== */

    .menu-toggle {
      display: none;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 5px;

      width: 38px;
      height: 38px;

      padding: 0;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: #ffffff;

      cursor: pointer;
    }

    .menu-toggle span {
      display: block;

      width: 17px;
      height: 2px;

      border-radius: 2px;

      background: var(--text);

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle[aria-expanded="true"] span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ==================================================
           联系卡片
        ================================================== */

    .contact-main {
      flex: 1;

      display: flex;

      align-items: center;
    }

    .contact-card {
      position: relative;

      width: 100%;
      min-height: 480px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 72px 40px;

      overflow: hidden;

      border: 1px solid var(--border);

      border-radius: var(--radius-large);

      background: #ffffff;

      box-shadow: var(--shadow);
    }

    /* ==================================================
           信封图标
        ================================================== */

    .icon-wrapper {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 108px;
      height: 108px;

      margin-bottom: 24px;

      border-radius: 50%;

      background: var(--accent-light);
    }

    .mail-icon {
      width: 52px;
      height: 52px;

      fill: none;
      stroke: var(--accent);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==================================================
           标题
        ================================================== */

    .title {
      position: relative;
      z-index: 2;

      text-align: center;
    }

    .title h1 {
      margin: 0;

      color: var(--text);

      font-size: clamp(32px, 4vw, 44px);

      line-height: 1.25;

      font-weight: 700;
    }

    .title-line {
      width: 46px;
      height: 4px;

      margin: 20px auto 30px;

      background: var(--accent);

      border-radius: 99px;
    }

    .description {
      position: relative;
      z-index: 2;

      max-width: 480px;

      color: var(--text-soft);

      font-size: 17px;

      line-height: 1.9;

      text-align: center;
    }

    /* ==================================================
           邮箱链接
        ================================================== */

    .email-link {
      position: relative;
      z-index: 2;

      width: min(560px, 100%);

      margin-top: 34px;
      padding: 22px 30px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;

      color: var(--accent);

      text-decoration: none;

      border: 1px solid var(--border);

      border-radius: var(--radius-medium);

      background: var(--accent-light);

      font-family: "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;

      font-size: clamp(19px, 2.4vw, 24px);

      font-weight: 600;

      letter-spacing: 0.2px;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .email-link:hover,
    .email-link:focus-visible {
      background: #e5f0ff;

      border-color: #cfe2ff;

      transform: translateY(-2px);

      box-shadow: 0 8px 24px rgba(38, 117, 237, 0.1);
    }

    .email-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .email-icon {
      width: 30px;
      height: 30px;

      flex-shrink: 0;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==================================================
           提示
        ================================================== */

    .note {
      position: relative;
      z-index: 2;

      margin-top: 30px;

      display: flex;
      align-items: center;
      gap: 9px;

      color: var(--text-light);

      font-size: 14px;

      line-height: 1.6;
    }

    .note-icon {
      width: 20px;
      height: 20px;

      flex-shrink: 0;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==================================================
           响应式
        ================================================== */

    @media (max-width: 800px) {
      .page {
        width: calc(100% - 28px);

        padding: 18px 0 25px;
      }

      .navbar {
        margin-bottom: 28px;
      }

      .menu-toggle {
        display: flex;
      }

      .nav-links {
        position: absolute;

        top: calc(100% + 12px);
        right: 0;

        z-index: 50;

        flex-direction: column;

        align-items: stretch;

        gap: 2px;

        width: 190px;

        padding: 10px;

        border: 1px solid var(--border);
        border-radius: 14px;

        background: #ffffff;

        box-shadow: var(--shadow);

        opacity: 0;
        visibility: hidden;

        transform: translateY(-6px);

        transition:
          opacity 0.2s ease,
          transform 0.2s ease,
          visibility 0.2s ease;
      }

      .nav-links.open {
        opacity: 1;
        visibility: visible;

        transform: translateY(0);
      }

      .nav-links a {
        padding: 11px 12px;

        border-radius: 9px;

        font-size: 15px;
      }

      .nav-links a::after {
        display: none;
      }

      .nav-links a:hover,
      .nav-links a:focus-visible,
      .nav-links a.active {
        color: var(--accent);

        background: var(--accent-light);
      }

      .contact-card {
        min-height: auto;

        padding: 48px 22px;

        border-radius: 18px;
      }

      .icon-wrapper {
        width: 88px;
        height: 88px;
      }

      .mail-icon {
        width: 42px;
        height: 42px;
      }

      .title h1 {
        font-size: 30px;
      }

      .description {
        font-size: 15px;
      }

      .email-link {
        padding: 18px 18px;

        font-size: 18px;

        gap: 10px;
      }

      .email-icon {
        width: 24px;
        height: 24px;
      }

      .note {
        font-size: 13px;

        text-align: center;

        max-width: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- 背景 -->
  <div class="background" aria-hidden="true"></div>

  <main class="page">
    <!-- ============================================
             顶部导航
        ============================================= -->
    <nav class="navbar" aria-label="主导航">
      <a href="/" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        LIUZHANGBIN
      </a>

      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-links" id="nav-links">
        <a href="/123/">网址导航</a>
        <a href="/creative/">创意工坊</a>
        <a href="/contact/" class="active">与我联系</a>
      </div>
    </nav>

    <!-- ============================================
             联系卡片
        ============================================= -->
    <div class="contact-main">
      <section class="contact-card">
        <div class="icon-wrapper">
          <svg class="mail-icon" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="9" y="15" width="46" height="34" rx="5"></rect>
            <path d="M11 19l21 17 21-17"></path>
          </svg>
        </div>

        <div class="title">
          <h1>与我联系</h1>
          <div class="title-line"></div>
        </div>

        <p class="description">
          任何想法、建议或纠错信息，都欢迎通过邮箱与我联系。
        </p>

        <a class="email-link" id="contact-email" aria-label="发送邮件联系我">
          <svg class="email-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M4 7l8 6 8-6"></path>
          </svg>

          <span id="contact-email-text">加载中…</span>
        </a>

        <p class="note">
          <svg class="note-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l7 3v5c0 4.5-2.9 7.9-7 10-4.1-2.1-7-5.5-7-10V6l7-3z"></path>
            <path d="M9 12l2 2 4-4"></path>
          </svg>

          <span>我会尽快查看并回复你的邮件，感谢你的关注与支持。</span>
        </p>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var toggle = document.getElementById("menu-toggle");
      var links = document.getElementById("nav-links");

      function closeMenu() {
        links.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
      }

      function openMenu() {
        links.classList.add("open");
        toggle.setAttribute("aria-expanded", "true");
      }

      if (toggle && links) {
        toggle.addEventListener("click", function (e) {
          e.stopPropagation();

          if (links.classList.contains("open")) {
            closeMenu();
          } else {
            openMenu();
          }
        });

        links.querySelectorAll("a").forEach(function (a) {
          a.addEventListener("click", closeMenu);
        });

        document.addEventListener("click", function (e) {
          if (!links.contains(e.target) && !toggle.contains(e.target)) {
            closeMenu();
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeMenu();
          }
        });
      }
    })();

    (function () {
      var user = "liu.zhangbin";
      var domain = "qq.com";
      var address = user + "@" + domain;

      var link = document.getElementById("contact-email");
      var text = document.getElementById("contact-email-text");

      if (link && text) {
        link.href = "mailto:" + address;
        link.setAttribute("aria-label", "发送邮件至 " + address);
        text.textContent = address;
      }
    })();
  </script>
</body>

</html>
