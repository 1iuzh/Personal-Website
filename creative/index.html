<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>创意工坊 · 实用工具集 - Liuzhangbin</title>
<meta name="description" content="Creative 实用工具集，提供密码生成、DNS 查询、硬盘容量换算、常用软件清单等实用工具。" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        /* 无衬线字体栈：系统字体优先，中文兜底到常见系统黑体 */
        --font-sans:
            system-ui,
            -apple-system, BlinkMacSystemFont,
            "Microsoft YaHei",
            "PingFang SC",
            "Source Han Sans SC","Noto Sans SC",
            "HarmonyOS Sans",
            "Hiragino Sans GB",
            "WenQuanYi Micro Hei",
            sans-serif;

        /* 等宽字体栈：用于版本号、校验值等代码感文字 */
        --font-mono:
            ui-monospace,
            "SF Mono",
            "Cascadia Code","Consolas",
            "JetBrains Mono",
            "Roboto Mono",
            "Sarasa Mono SC",
            "Microsoft YaHei","PingFang SC","Noto Sans SC",
            "WenQuanYi Zen Hei Mono",
            monospace;

        --bg: #f8f9fc;
        --panel: #ffffff;
        --panel-soft: #f6f8fb;
        --border: #e2e6ef;
        --border-soft: #ecf0f6;
        --text: #101113;
        --text-body: #343d4d;
        --text-dim: #687486;
        --text-muted: #97a1b3;

        --accent: #4361ee;
        --accent-soft: #eaefff;
        --glow: #ffb020;

        --shadow-sm: 0 2px 4px rgba(30, 41, 59, 0.06);
        --shadow-md: 0 10px 30px -22px rgba(30, 41, 59, 0.18);
        --shadow-hover: 0 16px 34px -18px rgba(30, 41, 59, 0.22);
        --radius-md: 10px;
        --radius-lg: 12px;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
        font-size: 16px;
    }

    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: var(--font-sans);
        line-height: 1.7;
        color: var(--text);
        background:
            radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255, 176, 32, 0.12), transparent 60%),
            radial-gradient(circle at 90% 10%, rgba(67, 97, 238, 0.06), transparent 40%),
            var(--bg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    /* ---------- navigation ---------- */
    .site-nav {
        position: sticky;
        top: 0;
        z-index: 20;
        flex-shrink: 0;
        background: rgba(248, 249, 252, 0.72);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
    }

    .nav-inner {
        max-width: 1040px;
        margin: 0 auto;
        padding: 10px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
    }

    .nav-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        color: var(--text);
        text-decoration: none;
    }

    .logo-mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        flex-shrink: 0;
        background: linear-gradient(135deg, var(--accent) 0%, #6c8bf5 55%, var(--glow) 130%);
        box-shadow: 0 6px 16px -6px rgba(67, 97, 238, 0.55);
        color: #fff;
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 0.78rem;
        letter-spacing: -0.02em;
    }

    .nav-brand-divider {
        width: 1px;
        height: 16px;
        background: var(--border);
        flex-shrink: 0;
    }

    .nav-brand-text {
        font-family: var(--font-mono);
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--text-dim);
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.2s ease;
    }

    .nav-brand:hover .nav-brand-text,
    .nav-brand:focus-visible .nav-brand-text {
        color: var(--accent);
    }

    .nav-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 28px;
        font-family: var(--font-sans);
        font-size: 0.95rem;
        font-weight: 500;
        flex-shrink: 0;
    }

    .site-nav a {
        color: #4f5969;
        text-decoration: none;
        transition: color 0.2s ease;
        border-radius: 4px;
        padding: 2px 4px;
        margin: -2px -4px;
    }

    .nav-links a::before {
        content: "/";
        color: #8a93a6;
        margin-right: 2px;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible {
        color: var(--accent);
    }

    .site-nav a[aria-current="page"] {
        color: var(--accent);
    }

    .nav-links a[aria-current="page"]::before {
        color: var(--accent);
    }

    a:focus-visible,
    button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
    }

    /* ---------- page layout ---------- */
    .page {
        flex: 1 0 auto;
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        padding: 56px 28px 24px;
    }

    /* ---------- hero ---------- */
    .hero {
        margin-bottom: 34px;
        text-align: center;
    }

    .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 600;
        color: #8a5a00;
        letter-spacing: 0.08em;
    }

    .eyebrow::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--glow);
        box-shadow: 0 0 12px var(--glow);
    }

    .hero h1 {
        font-family: var(--font-sans);
        font-size: clamp(2.2rem, 5vw, 3.1rem);
        line-height: 1.15;
        letter-spacing: 0;
        font-weight: 800;
        color: #0c1019;
        margin-bottom: 14px;
    }

    .hero h1 span {
        color: var(--text-dim);
        font-family: var(--font-mono);
        font-weight: 700;
    }

    .hero-description {
        max-width: 520px;
        margin: 0 auto;
        color: var(--text-dim);
        font-size: 1.08rem;
    }

    /* ---------- filters ---------- */
    .filters {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 36px;
    }

    .filter {
        padding: 8px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text-dim);
        font-family: var(--font-sans);
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
    }

    .filter:hover {
        color: var(--accent);
        border-color: #cfd8f5;
        transform: translateY(-1px);
    }

    .filter.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 8px 18px -10px rgba(67, 97, 238, 0.5);
    }

    /* ---------- section ---------- */
    .section {
        margin-bottom: 24px;
    }

    .section-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border-soft);
    }

    .section-title {
        font-family: var(--font-sans);
        font-size: 1.2rem;
        font-weight: 700;
        color: #0c1019;
    }

    .section-count {
        font-family: var(--font-mono);
        color: var(--text-muted);
        font-size: 0.85rem;
        white-space: nowrap;
    }

    /* ---------- tools grid ---------- */
    .tools-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
    }

    .tool-card {
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 22px;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        animation: cardIn 0.35s ease both;
    }

    .tool-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-hover);
        border-color: #cfd8f5;
    }

    .tool-card::after {
        content: "";
        position: absolute;
        width: 140px;
        height: 140px;
        right: -70px;
        bottom: -70px;
        border-radius: 50%;
        background: var(--accent-soft);
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .tool-card:hover::after {
        opacity: 0.6;
    }

    .tool-icon {
        position: relative;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        border-radius: var(--radius-md);
        background: var(--accent-soft);
        color: var(--accent);
    }

    .tool-icon svg {
        width: 21px;
        height: 21px;
    }

    .tool-name {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.04rem;
        font-weight: 700;
        color: #0c1019;
        margin-bottom: 6px;
    }

    .tool-featured-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--glow);
        box-shadow: 0 0 8px var(--glow);
        flex-shrink: 0;
    }

    .tool-description {
        position: relative;
        color: var(--text-dim);
        font-size: 0.9rem;
        line-height: 1.65;
    }

    .tool-meta {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 16px;
    }

    .tool-category {
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 0.76rem;
    }

    .tool-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-muted);
        transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .tool-arrow svg {
        width: 14px;
        height: 14px;
    }

    .tool-card:hover .tool-arrow {
        color: var(--accent);
        border-color: var(--accent);
        transform: translateX(2px);
    }

    /* ---------- empty ---------- */
    .empty {
        display: none;
        padding: 70px 20px;
        text-align: center;
        color: var(--text-dim);
        background: var(--panel-soft);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-lg);
    }

    .empty svg {
        width: 32px;
        height: 32px;
        margin-bottom: 14px;
        color: var(--text-muted);
    }

    .empty-title {
        color: var(--text);
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 4px;
    }

    .empty-description {
        font-size: 0.88rem;
        color: var(--text-muted);
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- footer ---------- */
    .site-footer {
        flex-shrink: 0;
        margin-top: 40px;
        background: #ffffff;
        border-top: 1px solid var(--border-soft);
    }

    .footer-inner {
        max-width: 1040px;
        margin: 0 auto;
        padding: 36px 28px 28px;
    }

    .footer-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 36px;
        margin-bottom: 28px;
    }

    .footer-brand .brand-name {
        font-family: var(--font-sans);
        font-size: 1.2rem;
        font-weight: 500;
        color: #0c1019;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .footer-brand .brand-name::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--glow);
        box-shadow: 0 0 10px var(--glow);
    }

    .footer-brand p {
        color: var(--text-dim);
        font-size: 1.02rem;
        line-height: 1.7;
        margin-bottom: 16px;
    }

    .footer-brand .version-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        background: var(--accent-soft);
        border: 1px solid #d7e0fb;
        border-radius: 6px;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        color: #2a44c4;
    }

    .footer-col-support {
        display: flex;
        justify-content: flex-end;
    }

    .footer-pill-row {
        display: grid;
        grid-template-columns: auto auto;
        gap: 10px 12px;
    }

    .footer-pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 16px 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: #f6f8fb;
        text-decoration: none;
        color: var(--text-dim);
        font-family: var(--font-sans);
        font-size: 0.92rem;
        font-weight: 500;
        white-space: nowrap;
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .footer-pill-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        flex-shrink: 0;
        transition: background 0.2s ease, color 0.2s ease;
    }

    .footer-pill-icon svg {
        width: 13px;
        height: 13px;
    }

    .footer-pill:hover,
    .footer-pill:focus-visible {
        background: #ffffff;
        border-color: #cfd8f5;
        color: var(--text);
        transform: translateY(-1px);
        box-shadow: 0 8px 18px -10px rgba(67, 97, 238, 0.4);
        outline: none;
    }

    .footer-pill:hover .footer-pill-icon,
    .footer-pill:focus-visible .footer-pill-icon {
        background: var(--accent);
        color: #ffffff;
    }

    .footer-divider {
        height: 1px;
        background: var(--border-soft);
        margin-bottom: 22px;
    }

    .footer-bottom {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-top: 4px;
    }

    .footer-bottom .copyright {
        color: var(--text-dim);
        font-family: var(--font-sans);
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        line-height: 1.6;
    }

    /* ---------- responsive ---------- */
    @media (max-width: 900px) {
        .tools-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 768px) {
        .footer-grid {
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .footer-col-support {
            justify-content: flex-start;
        }
        .footer-pill-row {
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (max-width: 600px) {
        html { font-size: 15px; }
        .page { padding: 40px 20px 24px; }
        .tools-grid {
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .nav-inner { padding: 12px 20px; gap: 14px; }
        .nav-brand-text { display: none; }
        .nav-brand-divider { display: none; }
        .nav-links { gap: 16px; font-size: 0.9rem; }
        .footer-bottom .copyright { font-size: 0.78rem; }
    }

    @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .tool-card { animation: none; transition: none; }
        .filter, .footer-pill, .footer-pill-icon { transition: none; transform: none; }
    }

    /* ---------- 打印样式 ---------- */
    @media print {
        body { background: #fff !important; }
        .site-nav,
        .filters { display: none !important; }
        .tool-card {
            box-shadow: none;
            border: 1px solid #ddd;
            break-inside: avoid;
        }
        .site-footer {
            background: #fff;
            border-top: 1px solid #ddd;
        }
    }
</style>
</head>

                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 5 6v6c0 4.5 3 7.2 7 8.5 4-1.3 7-4 7-8.5V6l-7-2.5Z"/><path d="m9.3 12 1.9 1.9 3.4-3.6"/></svg>
                            </span>

                        </a>

            <div class="footer-divider"></div>
            <div class="footer-bottom">
                <span class="copyright">Copyright © 2025–2026 LIUZHANGBIN.</span>
            </div>
        </div>
    </footer>

<script>
    /* ---------------- SVG 图标 ---------------- */
    const icons = {
        key: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8"/><path d="M16 6l2 2"/><path d="M18 4l2 2"/></svg>`,
        globe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 4 6 4 9s-1 6-4 9"/><path d="M12 3c-3 3-4 6-4 9s1 6 4 9"/></svg>`,
        package: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7.8L12 13l8.7-5.2"/><path d="M12 13v8"/></svg>`,
        drive: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h.01"/><path d="M10 15h.01"/><path d="M13 15h4"/></svg>`,
        hash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L8 21"/><path d="M16 3l-2 18"/><path d="M4 9h17"/><path d="M3 15h17"/></svg>`,
        arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>`,
    };

    /* ---------------- 工具数据 ---------------- */
    const tools = [
        {
            name: "常用软件清单",
            description: "Windows 装机、重装系统时的常用软件参考。",
            category: "system",
            categoryName: "系统与硬件",
            icon: "package",
            url: "/creative/newbuild/",
            tags: "Windows 软件 装机 重装系统",
            featured: false,
        },
        {
            name: "密码生成器",
            description: "生成随机、安全的密码，支持自定义长度与字符类型。",
            category: "security",
            categoryName: "安全工具",
            icon: "key",
            url: "/creative/password-generator/",
            tags: "密码 password 安全 随机",
            featured: false,
        },
        {
            name: "高级 DNS 工具",
            description: "查询 DNS 记录、解析结果以及域名相关网络信息。",
            category: "network",
            categoryName: "网络工具",
            icon: "globe",
            url: "/creative/nslookup/",
            tags: "DNS 域名 网络 nslookup",
            featured: false,
        },
        {
            name: "硬盘容量换算器",
            description: "快速进行 MB、GB、TB 等存储容量在不同工况下的单位换算。",
            category: "system",
            categoryName: "系统与硬件",
            icon: "drive",
            url: "/creative/hdcalc/",
            tags: "硬盘 SSD HDD 容量 GB TB",
            featured: false,
        },
        {
            name: "Hash Checker",
            description: "计算并校验文件的 MD5、SHA1、SHA256、SHA512 等哈希值。",
            category: "security",
            categoryName: "安全工具",
            icon: "hash",
            url: "/creative/hash-checker/",
            tags: "Hash MD5 SHA1 SHA256 SHA512 文件校验",
            featured: false,
        },
    ];

    /* ---------------- DOM ---------------- */
    const toolsGrid = document.getElementById("toolsGrid");
    const empty = document.getElementById("empty");
    const toolCount = document.getElementById("toolCount");
    const filters = document.querySelectorAll(".filter");

    let currentCategory = "all";

    function createToolCard(tool) {
        const card = document.createElement("a");
        card.className = "tool-card";
        card.href = tool.url;
        card.target = "_blank";
        card.rel = "noopener";
        card.innerHTML = `
            <div class="tool-icon">${icons[tool.icon] || icons.package}</div>
            <div class="tool-name">${tool.name}${tool.featured ? '<span class="tool-featured-dot" title="推荐"></span>' : ''}</div>
            <div class="tool-description">${tool.description}</div>
            <div class="tool-meta">
                <span class="tool-category">${tool.categoryName}</span>
                <span class="tool-arrow">${icons.arrow}</span>
            </div>
        `;
        return card;
    }

    function filterTools() {
        return tools.filter(
            (tool) => currentCategory === "all" || tool.category === currentCategory
        );
    }

    function render() {
        const filtered = filterTools();

        toolsGrid.innerHTML = "";
        filtered.forEach((tool) => {
            toolsGrid.appendChild(createToolCard(tool));
        });

        toolCount.textContent = `${filtered.length} 个工具`;

        empty.style.display = filtered.length === 0 ? "block" : "none";
    }

    function initFilters() {
        currentCategory = "all";
        filters.forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.category === currentCategory);
        });
    }

    filters.forEach((button) => {
        button.addEventListener("click", () => {
            filters.forEach((item) => item.classList.remove("active"));
            button.classList.add("active");
            currentCategory = button.dataset.category;
            render();
        });
    });

    initFilters();
    render();
</script>

</body>
</html>
