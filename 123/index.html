<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人网址导航：AI 应用、搜索引擎、社交媒体、购物、资讯、工具等常用网站分类合集。" />
    <title>网址导航</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="123.css" />
  </head>

  <body>
    <!-- 页首：仿 Apple 官网的极简单行导航条 -->
    <header>
      <div class="header-bar">
        <a href="" class="brand-link">
          <img src="favicon.png" alt="网址导航" class="brand-logo" />
        </a>

        <!-- 分类快捷导航：放进主导航条本身，横向滚动（分类较多，仿 Apple 产品页的二级导航条做法） -->
        <nav class="header-nav" id="header-nav" aria-label="分类导航">
          <div class="header-nav-inner">
            <!-- 由 JS 动态生成分类链接 -->
          </div>
        </nav>

        <button
          type="button"
          class="search-toggle"
          id="search-toggle"
          aria-expanded="false"
          aria-controls="search-panel"
          aria-label="打开搜索"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </div>

      <!-- 搜索面板：点击放大镜后从顶部展开，仿 Apple 官网的搜索交互 -->
      <div class="search-panel" id="search-panel" hidden>
        <div class="search-panel-inner">
          <div class="search-engine-tabs" role="radiogroup" aria-label="选择搜索引擎">
            <button class="search-tab active" data-engine="google" role="radio" aria-checked="true" tabindex="0">Google</button>
            <button class="search-tab" data-engine="bing" role="radio" aria-checked="false" tabindex="-1">Bing</button>
            <button class="search-tab" data-engine="baidu" role="radio" aria-checked="false" tabindex="-1">百度</button>
          </div>
          <div class="header-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="site-search" placeholder="输入关键词，回车搜索网页…" autocomplete="off" aria-label="搜索网页" />
          </div>
          <button type="button" class="search-close" id="search-close" aria-label="关闭搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- 主要内容 -->
    <main>
      <div class="grid-container"></div>
    </main>

    <!-- 返回顶部 -->
    <button class="back-to-top" id="back-to-top" aria-label="返回顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15" />
      </svg>
    </button>

    <!-- 页脚：极简信息条（统计信息 + 版权 + 常用链接） -->
    <footer>
      <div class="footer-container">
        <p class="footer-meta-line">
          <span id="footer-cat-count">0</span> 个分类 ·
          <span id="footer-link-count">0</span> 个网站 ·
          已运行 <span id="footer-uptime">0 天</span>
        </p>

        <div class="footer-divider"></div>

        <div class="footer-bottom">
          <p class="footer-copyright"> © 2025–2026 LIUZHANGBIN. </p>
          <ul class="footer-legal-links">
            <li><a href="/">主页</a></li>
            <li><a href="/creative/">创意工坊</a></li>
            <li><a href="/readme">用户协议</a></li>
            <li><a href="/contact">与我联系</a></li>
          </ul>
        </div>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
